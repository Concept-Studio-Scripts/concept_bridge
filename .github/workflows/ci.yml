name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # A new commit cancels the PR run it replaces; pushes, dispatches and release calls never share a group.
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

jobs:
  release-metadata:
    name: Release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check versions and manual release notes
        run: node tools/check-release.mjs
      - name: Check release failure gates
        run: node --test test/release-workflow.test.mjs test/manual-changelog.test.mjs test/release-policy.test.mjs

  lua:
    name: Lua checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Install Lua 5.4
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.4
      - name: Check Lua regression contracts
        run: |
          lua5.4 test/inventory_regressions.lua
          lua5.4 test/provider_docs.lua
          lua5.4 test/audit_regressions.lua
          lua5.4 test/runtime_identity.lua
          lua5.4 test/ox_lib_contracts.lua
          lua5.4 test/shop_transactions.lua
          lua5.4 test/housing_transitions.lua
          lua5.4 test/consumer_contracts.lua
          lua5.4 test/shell_access.lua
          lua5.4 test/provider_selection.lua
          lua5.4 test/esx_status_cache.lua
          lua5.4 test/handler_security.lua
          lua5.4 test/target_caninteract.lua
          lua5.4 test/framework_client_state.lua
          lua5.4 test/target_zones.lua
          lua5.4 test/manifest_files.lua
          lua5.4 test/extension_exports.lua
          lua5.4 test/version_checker.lua
          lua5.4 test/native_contracts.lua
          lua5.4 test/skill_registry.lua
          lua5.4 test/entity_rotation.lua
      - name: Check standard-Lua fixture/helper syntax
        run: |
          luac5.4 -p modules/framework/es_extended/client.lua
          find lib/inventory lib/shells lib/providers lib/security modules/providers modules/shops modules/housing test -name '*.lua' -print0 | xargs -0 -n1 luac5.4 -p
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install pinned LuaLS and FiveM definitions
        env:
          LUA_LS_VERSION: 3.19.1
          CFX_ADDON_REF: 6775f96e6356c44c2d89b12f2559c81818a8d915
        run: |
          curl -sL --fail -o "$RUNNER_TEMP/luals.tar.gz" "https://github.com/LuaLS/lua-language-server/releases/download/$LUA_LS_VERSION/lua-language-server-$LUA_LS_VERSION-linux-x64.tar.gz"
          printf '%s  %s\n' 'e9235d2d72ef55bc41cf8c99cda2ed64777682024b4bb81f5dea425060c5cbb8' "$RUNNER_TEMP/luals.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/luals"
          tar -xzf "$RUNNER_TEMP/luals.tar.gz" -C "$RUNNER_TEMP/luals"
          git init "$RUNNER_TEMP/cfx-luals-addon"
          git -C "$RUNNER_TEMP/cfx-luals-addon" remote add origin https://github.com/overextended/fivem-lls-addon.git
          git -C "$RUNNER_TEMP/cfx-luals-addon" fetch --depth 1 origin "$CFX_ADDON_REF"
          git -C "$RUNNER_TEMP/cfx-luals-addon" checkout --detach FETCH_HEAD
      - name: Check all runtime Lua with the reviewed diagnostic baseline
        env:
          LUA_LS: ${{ runner.temp }}/luals/bin/lua-language-server
          CFX_LUALS_ADDON: ${{ runner.temp }}/cfx-luals-addon
        run: |
          node --test test/lua-analysis.test.mjs
          node tools/check-lua.mjs
      - name: Save Lua analysis reports
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: bridge-lua-analysis
          path: release/lua-analysis/
          if-no-files-found: ignore
          retention-days: 1

  package:
    name: Packaging
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Check resource package
        shell: pwsh
        run: ./tools/package-release.ps1 -OutFile ./release/concept_bridge.zip
