name: Release

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to retry; leave empty for an artifact-only build'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: package-${{ inputs.tag || github.run_id }}
  cancel-in-progress: false

jobs:
  checks:
    permissions:
      contents: read
    uses: ./.github/workflows/inventory-tests.yml
    with:
      ref: ${{ inputs.ref || inputs.tag || github.sha }}

  package:
    name: Build and publish resource ZIP
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || inputs.tag || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify release versions and manual notes
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node tools/check-release.mjs "$RELEASE_TAG"
          if [ -n "$RELEASE_TAG" ]; then
            test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{commit}")"
          fi
      - name: Package resource ZIP
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $suffix = if ($env:RELEASE_TAG) { $env:RELEASE_TAG } else { 'preview' }
          ./tools/package-release.ps1 -Build -OutFile "./concept_bridge-$suffix.zip"
      - name: Save verified ZIP
        uses: actions/upload-artifact@v7
        with:
          name: concept_bridge-${{ inputs.tag || 'preview' }}
          path: concept_bridge-*.zip
          if-no-files-found: error
      - name: Attach ZIP and publish manual release notes
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "$RELEASE_TAG" "concept_bridge-${RELEASE_TAG}.zip#Full resource (prebuilt UI)" --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$RELEASE_TAG" --title "concept_bridge $RELEASE_TAG" --notes-file release-notes.md --draft=false --latest --repo "$GITHUB_REPOSITORY"
