name: Concept Bridge checks

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string

permissions:
  contents: read

jobs:
  release-metadata:
    name: Release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check versions and manual release notes
        run: node tools/check-release.mjs
      - name: Check release failure gates
        run: node --test test/release-workflow.test.mjs
      - name: Check conventional PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node --input-type=module -e "if (!/^(feat|fix|docs|refactor|perf|test|build|ci|chore|revert)(\([^\r\n)]+\))?!?: \S/.test(process.env.PR_TITLE)) throw new Error('Use a Conventional Commit PR title, for example fix(shells): restore the player bucket')"

  inventory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Install Lua 5.4
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.4
      - name: Check Lua regression contracts
        run: |
          lua5.4 test/inventory_regressions.lua
          lua5.4 test/provider_docs.lua
          lua5.4 test/audit_regressions.lua
          lua5.4 test/runtime_identity.lua
          lua5.4 test/ox_lib_contracts.lua
          lua5.4 test/shop_transactions.lua
          lua5.4 test/housing_transitions.lua
          lua5.4 test/consumer_contracts.lua
          lua5.4 test/shell_access.lua
          lua5.4 test/provider_selection.lua
          lua5.4 test/handler_security.lua
      - name: Check standard-Lua fixture/helper syntax
        run: |
          find lib/inventory lib/shells lib/providers lib/security modules/providers modules/shops modules/housing test -name '*.lua' -print0 | xargs -0 -n1 luac5.4 -p

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install, lint and build NUI
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Check rebuilt resource and package
        shell: pwsh
        run: ./tools/package-release.ps1 -OutFile ./release/concept_bridge.zip
